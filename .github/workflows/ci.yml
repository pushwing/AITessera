name: CI

on:
  pull_request:
    branches: [main]     # dev → main 배포 PR 에서만 돈다. feature → dev PR 은 로컬 검증(git hooks)이 게이트.

# 같은 ref 에 새 푸시가 오면 진행 중 실행을 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.4 · CS · PHPStan · PHPUnit)
    # self-hosted macOS 러너 (호스팅 러너 결제 문제로 전환). services: 는 Linux 러너 전용
    # 기능이라 macOS 러너에서는 지원되지 않으므로, MySQL·Redis 는 아래에서 docker run 으로
    # 직접 기동하고 always() 스텝으로 정리한다.
    runs-on: [self-hosted, macOS, ARM64]

    env:
      # 이 Mac 은 로컬 개발용 mysqld(3306)·redis-server(6379) 를 상시 띄워두고 있고,
      # 다른 저장소의 self-hosted CI 컨테이너와도 겹치지 않는 포트를 쓴다.
      CI_MYSQL_PORT: 23306
      CI_REDIS_PORT: 26379
      CI_MYSQL_CONTAINER: aitessera-ci-mysql-${{ github.run_id }}
      CI_REDIS_CONTAINER: aitessera-ci-redis-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MySQL·Redis 컨테이너 기동
        run: |
          docker run -d --name "$CI_MYSQL_CONTAINER" \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=aitessera \
            -e MYSQL_USER=aitessera \
            -e MYSQL_PASSWORD=aitessera \
            -p "127.0.0.1:${CI_MYSQL_PORT}:3306" \
            mysql:8.0

          docker run -d --name "$CI_REDIS_CONTAINER" \
            -p "127.0.0.1:${CI_REDIS_PORT}:6379" \
            redis:7

      - name: MySQL 헬스 대기
        run: |
          for i in $(seq 1 30); do
            if docker exec "$CI_MYSQL_CONTAINER" mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL 헬스체크 타임아웃"
          exit 1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, redis, curl, dom, xml, tokenizer
          coverage: pcov
          tools: composer:v2

      - name: Composer 캐시 디렉토리 확인
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer 패키지 캐시
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env 준비 (CI용 DB·Redis·JWT 주입)
        run: |
          cp .env.example .env
          # macOS(BSD) sed — 확장자 인자 없는 GNU 방식 `-i` 는 여기서 동작하지 않는다
          sed -i '' \
            -e 's|^APP_ENV=.*|APP_ENV=testing|' \
            -e 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' \
            -e "s|^DB_PORT=.*|DB_PORT=${CI_MYSQL_PORT}|" \
            -e 's|^DB_NAME=.*|DB_NAME=aitessera|' \
            -e 's|^DB_USER=.*|DB_USER=aitessera|' \
            -e 's|^DB_PASS=.*|DB_PASS=aitessera|' \
            -e 's|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|' \
            -e "s|^REDIS_PORT=.*|REDIS_PORT=${CI_REDIS_PORT}|" \
            -e 's|^JWT_SECRET=.*|JWT_SECRET=ci_test_secret_at_least_32_characters_long|' \
            .env

      - name: 런타임 디렉토리 생성 (git 미추적, 경로 보장)
        run: mkdir -p var/cache var/logs/raw var/logs/queue-failed

      - name: PHP-CS-Fixer (dry-run)
        run: composer cs-check

      - name: PHPStan (level 8)
        run: composer analyse

      - name: 마이그레이션 (테스트 스키마 구성)
        run: php bin/console migrate

      - name: PHPUnit (단위·DB 통합)
        run: composer test

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f -v "$CI_MYSQL_CONTAINER" "$CI_REDIS_CONTAINER" 2>/dev/null || true
