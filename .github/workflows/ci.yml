name: CI

on:
  pull_request:
    branches: [main]     # dev → main 배포 PR 에서만 돈다. feature → dev PR 은 로컬 검증(git hooks)이 게이트.

# 같은 ref 에 새 푸시가 오면 진행 중 실행을 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.5 · CS · PHPStan · PHPUnit · Coverage)
    timeout-minutes: 30
    # self-hosted Linux(X64) 조직 러너(호스팅 러너 결제 문제로 전환, 이후 org 러너 1개로 통일).
    # Linux 러너는 services: 를 네이티브 지원하므로 MySQL·Redis 는 컨테이너 서비스로 기동한다
    # (기동·헬스체크·정리를 Actions 러너가 대신 처리 — macOS 시절의 docker run 수동 관리 불필요).
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: read
      pull-requests: write

    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
      # 이 러너는 다른 저장소의 self-hosted CI 서비스 컨테이너와 겹치지 않는 포트를 쓴다.
      CI_MYSQL_PORT: 23306
      CI_REDIS_PORT: 26379

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aitessera
          MYSQL_USER: aitessera
          MYSQL_PASSWORD: aitessera
        ports:
          - 23306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 26379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-php는 Ubuntu 26.04의 ondrej/php PPA에 의존해 실패·무한 대기할 수
      # 있다. runner의 네이티브 apt 패키지를 필요한 경우에만 설치하고, 이미 준비된
      # 영속 runner에서는 설치를 건너뛴다. Redis 클라이언트는 predis/predis다.
      - name: PHP · 확장 확인 (없을 때만 apt 설치)
        run: |
          set -euo pipefail
          PKGS="php-cli php-intl php-mbstring php-mysql php-xml php-curl php-zip php-xdebug"
          MISSING=""
          for p in $PKGS; do
            if ! dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q '^install ok installed$'; then
              MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "설치 필요:$MISSING"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $MISSING
          else
            echo "필요 패키지 모두 설치됨 — apt 건너뜀"
          fi
          php -v
          composer --version
          php -r 'exit(version_compare(PHP_VERSION, "8.4", ">=") ? 0 : 1);' \
            || { echo "::error::PHP 8.4 이상이 필요하다 (현재 $(php -r 'echo PHP_VERSION;'))"; exit 1; }
          php -m | grep -qi '^xdebug$' \
            || { echo "::error::xdebug 확장이 로드되지 않았다 — 커버리지를 낼 수 없다"; exit 1; }

      - name: Composer 캐시 디렉토리 확인
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer 패키지 캐시
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env 준비 (CI용 DB·Redis·JWT 주입)
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^APP_ENV=.*|APP_ENV=testing|' \
            -e 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' \
            -e "s|^DB_PORT=.*|DB_PORT=${CI_MYSQL_PORT}|" \
            -e 's|^DB_NAME=.*|DB_NAME=aitessera|' \
            -e 's|^DB_USER=.*|DB_USER=aitessera|' \
            -e 's|^DB_PASS=.*|DB_PASS=aitessera|' \
            -e 's|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|' \
            -e "s|^REDIS_PORT=.*|REDIS_PORT=${CI_REDIS_PORT}|" \
            -e 's|^JWT_SECRET=.*|JWT_SECRET=ci_test_secret_at_least_32_characters_long|' \
            .env

      - name: 런타임 디렉토리 생성 (git 미추적, 경로 보장)
        run: mkdir -p var/cache var/logs/raw var/logs/queue-failed

      - name: PHP-CS-Fixer (dry-run)
        run: composer cs-check

      - name: PHPStan (level 8)
        run: composer analyse

      - name: 마이그레이션 (테스트 스키마 구성)
        run: php bin/console migrate

      - name: PHPUnit (단위·DB 통합·커버리지)
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p build
          vendor/bin/phpunit \
            --coverage-text=build/coverage.txt \
            --coverage-cobertura=build/cobertura.xml

      - name: 커버리지 요약
        if: always()
        run: |
          [ -f build/coverage.txt ] || exit 0
          {
            echo '### 📊 커버리지'
            echo '```'
            cat build/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary (markdown)
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: build/cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: file
          thresholds: '50 75'

      - name: Post coverage PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
