name: CI

on:
  pull_request:
    branches: [main]     # dev → main 배포 PR 에서만 돈다. feature → dev PR 은 로컬 검증(git hooks)이 게이트.

# 같은 ref 에 새 푸시가 오면 진행 중 실행을 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.5 · CS · PHPStan · PHPUnit · Coverage)
    # self-hosted Linux(X64) 조직 러너(호스팅 러너 결제 문제로 전환, 이후 org 러너 1개로 통일).
    # Linux 러너는 services: 를 네이티브 지원하므로 MySQL·Redis 는 컨테이너 서비스로 기동한다
    # (기동·헬스체크·정리를 Actions 러너가 대신 처리 — macOS 시절의 docker run 수동 관리 불필요).
    runs-on: [self-hosted, Linux, X64]

    env:
      # 이 러너는 다른 저장소의 self-hosted CI 서비스 컨테이너와 겹치지 않는 포트를 쓴다.
      CI_MYSQL_PORT: 23306
      CI_REDIS_PORT: 26379

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aitessera
          MYSQL_USER: aitessera
          MYSQL_PASSWORD: aitessera
        ports:
          - 23306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 26379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # Redis 클라이언트는 Composer의 predis/predis를 사용하므로 PHP redis
          # extension은 필요하지 않다. self-hosted setup-php 설치 지연도 피한다.
          extensions: mbstring, intl, pdo_mysql, curl, dom, xml, tokenizer
          # AIPicto와 동일하게 Linux self-runner에서 Xdebug를 사용한다.
          # pcov 설치 실패로 setup-php가 중단되는 환경에서도 coverage를 확보한다.
          coverage: xdebug
          tools: composer:v2

      - name: Composer 캐시 디렉토리 확인
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer 패키지 캐시
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env 준비 (CI용 DB·Redis·JWT 주입)
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^APP_ENV=.*|APP_ENV=testing|' \
            -e 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' \
            -e "s|^DB_PORT=.*|DB_PORT=${CI_MYSQL_PORT}|" \
            -e 's|^DB_NAME=.*|DB_NAME=aitessera|' \
            -e 's|^DB_USER=.*|DB_USER=aitessera|' \
            -e 's|^DB_PASS=.*|DB_PASS=aitessera|' \
            -e 's|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|' \
            -e "s|^REDIS_PORT=.*|REDIS_PORT=${CI_REDIS_PORT}|" \
            -e 's|^JWT_SECRET=.*|JWT_SECRET=ci_test_secret_at_least_32_characters_long|' \
            .env

      - name: 런타임 디렉토리 생성 (git 미추적, 경로 보장)
        run: mkdir -p var/cache var/logs/raw var/logs/queue-failed

      - name: PHP-CS-Fixer (dry-run)
        run: composer cs-check

      - name: PHPStan (level 8)
        run: composer analyse

      - name: 마이그레이션 (테스트 스키마 구성)
        run: php bin/console migrate

      - name: PHPUnit (단위·DB 통합·커버리지)
        run: |
          mkdir -p build
          XDEBUG_MODE=coverage vendor/bin/phpunit \
            --coverage-text=build/coverage.txt \
            --coverage-cobertura=build/cobertura.xml

      - name: 커버리지 요약
        if: always()
        run: |
          {
            echo '### 📊 커버리지'
            echo '```'
            if [ -f build/coverage.txt ]; then
              cat build/coverage.txt
            else
              echo '커버리지 리포트가 생성되지 않았습니다.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
